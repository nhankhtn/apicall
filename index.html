<!doctype html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApiCall Runner</title>
    <meta name="theme-color" content="#0267c7" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("apicall-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>

  </head>

  </body>
</html>
