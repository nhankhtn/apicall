<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApiCall Runner</title>
    <meta name="theme-color" content="#0267c7" />
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("apicall-theme"); } catch (e) {}
        var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ApiCall" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Keep the install prompt for the Install button, which may mount after the event fires.
      window.__apicallInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (event) {
        event.preventDefault();
        window.__apicallInstallPrompt = event;
        window.dispatchEvent(new Event("apicall-install"));
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
